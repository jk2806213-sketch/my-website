<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin: 0;
            padding: 100px 20px;
        }

        .box {
            background: white;
            color: #333;
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
            border-radius: 20px;
        }

        h1 {
            color: #764ba2;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Welcome to My Website!</h1>
        <p>Hello everyone! My website is now ready.</p>
        <button onclick="alert('Thank you for visiting!')">
            Click Me
        </button>
    </div>
</body>
</html>
